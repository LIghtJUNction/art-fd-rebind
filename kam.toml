[prop]
id = "art_fd_rebind"
name = "ART FD Namespace Repair (experiment)"
version = "v0.1.1"
versionCode = 2
author = "LIghtJUNction; AOSP/NoHello FD helpers"
description = "Opt-in reopening of stale read-only ART archive descriptors after namespace isolation"

[kam]
min_api = 26
supported_arch = ["arm64-v8a", "armeabi-v7a"]
module_type = "kam"

[kam.build]
source_dir = "src/art_fd_rebind"
target_dir = "dist"
output_file = "{{id}}-{{version}}"
hooks_dir = "hooks"
exclude = [".git/", "*.log"]

[kam.workspace]
members = ["."]
