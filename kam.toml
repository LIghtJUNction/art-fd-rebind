[prop]
id = "art_fd_rebind"
name = "App Namespace Experiments"
version = "v0.2.4"
versionCode = 7
author = "LIghtJUNction; AOSP/NoHello FD helpers"
description = "Opt-in ART FD rebind and private Oplus overlay isolation experiments"

[kam]
min_api = 26
supported_arch = ["arm64-v8a", "armeabi-v7a"]
module_type = "kam"

[kam.build]
source_dir = "src/art_fd_rebind"
target_dir = "dist"
output_file = "{{id}}-{{version}}"
hooks_dir = "hooks"
exclude = [".git/", "*.log"]

[kam.workspace]
members = ["."]
